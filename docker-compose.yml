services:
  frontend:
    build:
      context: ./frontend
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://document_user:document_password@db:5432/document_intake
      GOOGLE_SHEETS_CREDENTIALS_FILE: /run/secrets/document-intake/service-account.json
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_RANGE: ${GOOGLE_SHEETS_RANGE:-Approved Records!A:I}
      N8N_API_KEY: ${N8N_API_KEY:-}
    volumes:
      - ./credentials:/run/secrets/document-intake:ro
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  n8n:
    profiles: ["n8n"]
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.6.4}
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Los_Angeles}
    ports: ["127.0.0.1:5678:5678"]
    volumes: ["n8n_data:/home/node/.n8n"]
    depends_on:
      api:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: document_intake
      POSTGRES_USER: document_user
      POSTGRES_PASSWORD: document_password
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_user -d document_intake"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  n8n_data:
